name: LinkIntel AI CI Pipeline

on:
  push:
    branches: [main, final-dxora-submission]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          DATABASE_URL: sqlite:///:memory:

  frontend-test-and-build:
    name: Frontend Verification & Build (TanStack Start & Nitro)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Frontend Dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript Type Check
        run: |
          npx tsc --noEmit

      - name: Run Frontend Vitest Suite
        run: |
          pnpm test

      - name: Build SSR Bundle with Nitro (Render Preset)
        run: |
          pnpm run build
        env:
          NITRO_PRESET: render_com
          NODE_ENV: production
